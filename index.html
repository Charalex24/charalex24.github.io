<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lex | Portfolio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Charalex</h1>
    <p>Web Dev | Artist</p>
    <a href="#gallery" class="btn">View My Work</a>
</header>

<section class="about" id="about">
    <h2>About Me</h2>
    <p>
        I am a passionate artist who does a bit of coding as my side hobby. 
        <br>I use my skills to create fan content for my favorite characters.
    </p>
</section>

<section id="gallery">
    <h2>Art Portfolio</h2>

    <div class="category">
        <h3>Low Poly</h3>
        <div class="grid">
            <div class="art-card">
                <img src="images/lowpoly1.png">
            </div>

            <div class="art-card">
                <img src="images/lowpoly2.png">
            </div>

            <div class="art-card">
                <img src="images/lowpoly3.png">
            </div>
        </div>
    </div>

    <div class="category">
        <h3>Headshots</h3>
        <div class="grid">
            <div class="art-card">
                <img src="images/headshot1.png" alt="Headshot Commission">
            </div>
            <div class="art-card">
                <img src="images/headshot2.png" alt="Headshot Commission">
            </div>
            <div class="art-card">
                <img src="images/headshot3.png" alt="Headshot Commission">
            </div>
        </div>
    </div>

    <div class="category">
        <h3>Half Body</h3>
        <div class="grid">
            <div class="art-card">
                <img src="images/halfbody1.png" alt="Half Body Commission">
            </div>
            <div class="art-card">
                <img src="images/halfbody2.png" alt="Half Body Commission">
            </div>
            <div class="art-card">
                <img src="images/halfbody3.png" alt="Half Body Commission">
            </div>
        </div>
    </div>

    <div class="category">
        <h3>Full Body</h3>
        <div class="grid">
            <div class="art-card">
                <img src="images/fullbody1.png" alt="Full Body Commission">
            </div>
            <div class="art-card">
                <img src="images/fullbody2.png" alt="Full Body Commission">
            </div>
            <div class="art-card">
                <img src="images/fullbody3.png" alt="Full Body Commission">
            </div>
        </div>
    </div>
</section>
<script src="script.js"></script>
</body>
</html>
