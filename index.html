<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lex | Portfolio</title>
<link rel="stylesheet" href="styles.css">
</head>
<script src="script.js"></script>
<body>

<header>
    <h1>Charalex</h1>
    <p>Web Dev | Artist</p>
    <a href="#gallery" class="btn">View My Work</a>
</header>

<section class="about" id="about">
    <h2>About Me</h2>
    <p>
        I am a passionate artist who does a bit of coding as my side hobby. I use my skills to create fan content for my favorite characters.
    </p>
</section>

<section id="gallery">
    <h2>Art Portfolio</h2>

    <div class="category">
        <h3>Low Poly</h3>
        <div class="grid">
            <img src="images/lowpoly1.jpg" alt="Low Poly Art">
            <img src="images/lowpoly2.jpg" alt="Low Poly Art">
            <img src="images/lowpoly3.jpg" alt="Low Poly Art">
        </div>
    </div>

    <div class="category">
        <h3>Headshots</h3>
        <div class="grid">
            <img src="images/headshot1.jpg" alt="Headshot Commission">
            <img src="images/headshot2.jpg" alt="Headshot Commission">
            <img src="images/headshot3.jpg" alt="Headshot Commission">
        </div>
    </div>

    <div class="category">
        <h3>Half Body</h3>
        <div class="grid">
            <img src="images/halfbody1.jpg" alt="Half Body Commission">
            <img src="images/halfbody2.jpg" alt="Half Body Commission">
            <img src="images/halfbody3.jpg" alt="Half Body Commission">
        </div>
    </div>

    <div class="category">
        <h3>Full Body</h3>
        <div class="grid">
            <img src="images/fullbody1.jpg" alt="Full Body Commission">
            <img src="images/fullbody2.jpg" alt="Full Body Commission">

        </div>
    </div>
