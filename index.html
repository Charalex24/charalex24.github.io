<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lex | Portfolio</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header>
    <h1>Charalex</h1>
    <p>Web Dev | Artist</p>
    <a href="#gallery" class="btn">View My Work</a>
</header>

<section class="about" id="about">
    <h2>About Me</h2>
    <p>
        Hi! I'm an artist who does a bit of coding as my side hobby. ≽^•⩊•^≼ 
        <br>Making use of my skills to create fan content for my favorite characters.
    </p>
</section>

<section id="gallery">
    <h2>Art Portfolio</h2>

    <div class="tabs">
    <button onclick="showGallery('lowpoly')">Low Poly</button>
    <button onclick="showGallery('headshot')">Headshots</button>
    <button onclick="showGallery('halfbody')">Half Body</button>
    <button onclick="showGallery('fullbody')">Full Body</button>
    </div>
    <div id="lowpoly" class="category active">
        <h3>Low Poly</h3>
        <div class="grid">
            <div class="art-card">
                <img src="images/lowpoly1.png">
            </div>

            <div class="art-card">
                <img src="images/lowpoly2.png">
            </div>

            <div class="art-card">
                <img src="images/lowpoly3.png">
            </div>
        </div>
    </div>

    <div id="headshot" class="category">
        <h3>Headshots</h3>
        <div class="grid">
            <div class="art-card">
                <img src="images/headshot1.png" alt="Headshot Commission">
            </div>
            <div class="art-card">
                <img src="images/headshot2.png" alt="Headshot Commission">
            </div>
            <div class="art-card">
                <img src="images/headshot3.png" alt="Headshot Commission">
            </div>
        </div>
    </div>

    <div id="halfbody" class="category">
        <h3>Half Body</h3>
        <div class="grid">
            <div class="art-card">
                <img src="images/halfbody1.png" alt="Half Body Commission">
            </div>
            <div class="art-card">
                <img src="images/halfbody2.png" alt="Half Body Commission">
            </div>
            <div class="art-card">
                <img src="images/halfbody3.png" alt="Half Body Commission">
            </div>
        </div>
    </div>

    <div id="fullbody" class="category">
        <h3>Full Body</h3>
        <div class="grid">
            <div class="art-card">
                <img src="images/fullbody1.png" alt="Full Body Commission">
            </div>
            <div class="art-card">
                <img src="images/fullbody2.png" alt="Full Body Commission">
            </div>
            <div class="art-card">
                <img src="images/fullbody3.png" alt="Full Body Commission">
            </div>
        </div>
    </div>
</section>

<section class="contact">
    <h2>Contact</h2>

    <p>
        <i class="fa-solid fa-envelope"></i>
        charalexmail@gmail.com
    </p>

    <p>
        <i class="fa-brands fa-discord"></i>
        @charaalex
    </p>
</section>

<script src="script.js"></script>
</body>
</html>
